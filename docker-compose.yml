services:
  db:
    image: postgres:16-alpine
    container_name: inventory_db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: inventory_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-compose-production-inventory-secret-key-change-in-prod
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - DATABASE_URL=postgres://postgres:postgres@db:5432/inventory_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
